<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<title>Hovedvejens Auto Sydfyn</title>
<link rel="icon" type="image/png" href="../icons/ikon3-192.png">
<style>
:root { --red: #d81f26; --ink: #111; --muted: #5c5c5c; --line: #e3e3e3; --bg: #f4f4f2; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); background: var(--bg); line-height: 1.45; }
header { background: var(--ink); color: #fff; padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top)); display: flex; align-items: center; gap: 10px; }
header img { height: 30px; width: auto; }
header span { font-weight: 800; letter-spacing: .02em; font-size: 15px; text-transform: uppercase; }
main { max-width: 640px; margin: 0 auto; padding: 0 0 32px; }
.card { background: #fff; margin: 0 0 12px; padding: 18px 16px; }
.ribbon { display: inline-block; background: var(--red); color: #fff; font-weight: 800; letter-spacing: .04em; padding: 5px 10px; font-size: 14px; text-transform: uppercase; margin-bottom: 10px; }
h1 { font-size: 24px; line-height: 1.2; margin: 0; }
.variant { color: var(--muted); margin: 2px 0 0; font-size: 16px; }
.price { font-size: 46px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; margin: 14px 0 0; }
.price small { font-size: 20px; color: var(--red); font-weight: 800; letter-spacing: 0; margin-left: 4px; }
.facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 16px; }
.fact { background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.fact .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fact .v { font-size: 18px; font-weight: 700; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.badges span { background: var(--red); color: #fff; font-weight: 800; font-size: 13px; padding: 5px 9px; text-transform: uppercase; letter-spacing: .02em; }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; }
ul.eq { list-style: none; margin: 0; padding: 0; columns: 2 160px; column-gap: 16px; }
ul.eq li { padding: 4px 0 4px 24px; position: relative; break-inside: avoid; }
ul.eq li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 6px; height: 11px; border: solid var(--ink); border-width: 0 3px 3px 0; transform: rotate(45deg); }
.cta { display: grid; gap: 10px; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 10px; font-size: 18px; font-weight: 800; text-decoration: none; border: 2px solid var(--ink); color: var(--ink); background: #fff; }
.btn.main { background: var(--red); border-color: var(--red); color: #fff; }
.webbtn { margin-top: 16px; text-align: center; }
.info { color: var(--muted); font-size: 15px; margin: 12px 0 0; }
.info b { color: var(--ink); }
.msg { text-align: center; padding: 34px 16px; }
.msg h1 { margin-bottom: 8px; }
.skel { height: 18px; background: var(--line); border-radius: 6px; margin: 10px 0; animation: p 1.2s ease-in-out infinite; }
@keyframes p { 50% { opacity: .5; } }
footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 16px; }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
</style>
</head>
<body>
<header><img src="../icons/logo-hvid.png" alt=""><span>Hovedvejens Auto Sydfyn</span></header>
<main id="main" aria-live="polite">
  <div class="card"><div class="skel" style="width:40%"></div><div class="skel" style="width:80%;height:28px"></div><div class="skel" style="width:55%;height:44px"></div><div class="skel"></div></div>
</main>
<script src="kunde.js"></script>
</body>
</html>
